[package]
name = "tilewright"
version = "0.1.0"
description = "A local grid map editor"
edition = "2021"
rust-version = "1.90"
publish = false

[features]
performance = []

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-dialog = { version = "=2.8.4", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
tempfile = "=3.27.0"
libc = "=0.2.191"
serde_json = "=1.0.154"
sha2 = "=0.10.9"
uuid = { version = "=1.29.3", features = ["v4"] }
rustix = { version = "=1.1.6", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSResponder"] }
