[package]
name = "tilewright"
version = "0.1.0"
description = "A local grid map editor"
edition = "2021"
rust-version = "1.90"
publish = false

[features]
performance = []

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-dialog = { version = "=2.8.4", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
tempfile = "=3.27.0"
libc = "=0.2.191"
